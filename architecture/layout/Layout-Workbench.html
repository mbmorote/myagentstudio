<meta charset="utf-8">
<title>Agent Workbench — Layout</title>
<style>
  :root{
    /* light (picked, slight cool bias toward the teal accent) */
    --bg:#e9edf2; --panel:#f6f8fb; --elev:#ffffff; --border:#d2dae4;
    --text:#1b2430; --muted:#5b6879; --faint:#8996a6;
    --accent:#0e9d8e; --accent-ink:#0a5f57; --accent-wash:rgba(14,157,142,.10);
    --ok:#2f9e5f; --warn:#b3801c; --err:#cf4b41;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --grip:#c3ccd8;
    /* config-pill category colors (punch-list item 2 — see app/globals.css) */
    --cap:#7c5cc2; --cap-ink:#4a2d8f; --cap-wash:rgba(124,92,194,.09);
    --ctl:#3e72c4; --ctl-ink:#1a4585; --ctl-wash:rgba(62,114,196,.09);
    --res:#b09228; --res-ink:#6b5500; --res-wash:rgba(176,146,40,.09);
    --prs:#b54870; --prs-ink:#7a1d40; --prs-wash:rgba(181,72,112,.09);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12151a; --panel:#191d23; --elev:#20252d; --border:#2a3039;
      --text:#e6ebf2; --muted:#8b95a5; --faint:#616c7c;
      --accent:#3fb6a8; --accent-ink:#8fe0d5; --accent-wash:rgba(63,182,168,.12);
      --ok:#5fb87a; --warn:#d9a441; --err:#e0685f; --grip:#39414c;
      --cap:#a98ae8; --cap-ink:#ccb8fb; --cap-wash:rgba(169,138,232,.12);
      --ctl:#75a8e8; --ctl-ink:#a8c8fc; --ctl-wash:rgba(117,168,232,.12);
      --res:#d4b45e; --res-ink:#eed98e; --res-wash:rgba(212,180,94,.12);
      --prs:#e0809f; --prs-ink:#f5b0c8; --prs-wash:rgba(224,128,159,.12);
    }
  }
  :root[data-theme="light"]{
    --bg:#e9edf2; --panel:#f6f8fb; --elev:#ffffff; --border:#d2dae4;
    --text:#1b2430; --muted:#5b6879; --faint:#8996a6;
    --accent:#0e9d8e; --accent-ink:#0a5f57; --accent-wash:rgba(14,157,142,.10);
    --ok:#2f9e5f; --warn:#b3801c; --err:#cf4b41; --grip:#c3ccd8;
    --cap:#7c5cc2; --cap-ink:#4a2d8f; --cap-wash:rgba(124,92,194,.09);
    --ctl:#3e72c4; --ctl-ink:#1a4585; --ctl-wash:rgba(62,114,196,.09);
    --res:#b09228; --res-ink:#6b5500; --res-wash:rgba(176,146,40,.09);
    --prs:#b54870; --prs-ink:#7a1d40; --prs-wash:rgba(181,72,112,.09);
  }
  :root[data-theme="dark"]{
    --bg:#12151a; --panel:#191d23; --elev:#20252d; --border:#2a3039;
    --text:#e6ebf2; --muted:#8b95a5; --faint:#616c7c;
    --accent:#3fb6a8; --accent-ink:#8fe0d5; --accent-wash:rgba(63,182,168,.12);
    --ok:#5fb87a; --warn:#d9a441; --err:#e0685f; --grip:#39414c;
    --cap:#a98ae8; --cap-ink:#ccb8fb; --cap-wash:rgba(169,138,232,.12);
    --ctl:#75a8e8; --ctl-ink:#a8c8fc; --ctl-wash:rgba(117,168,232,.12);
    --res:#d4b45e; --res-ink:#eed98e; --res-wash:rgba(212,180,94,.12);
    --prs:#e0809f; --prs-ink:#f5b0c8; --prs-wash:rgba(224,128,159,.12);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--ui); font-size:13px; line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---- top chrome ---- */
  .topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:16px;
    padding:9px 16px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:-.01em}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .brand small{color:var(--faint); font-weight:400; letter-spacing:.04em; text-transform:uppercase; font-size:10px}

  .theme{
    font:inherit; font-size:12px; color:var(--muted); background:var(--bg);
    border:1px solid var(--border); border-radius:7px; padding:5px 11px; cursor:pointer;
  }

  /* ---- workbench grid ---- */
  .workbench{flex:1 1 auto; display:flex; min-height:0; padding:9px; gap:0}
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:9px;
    display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden;
  }
  .col{display:flex; flex-direction:column; min-width:0; min-height:0}
  .left{flex:0 0 218px}
  .center{flex:1 1 auto}
  .right{flex:0 0 340px}
  .center-top{flex:1 1 auto; min-height:0}
  .center-bottom{flex:0 0 240px; min-height:0}

  /* panel header */
  .phead{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:8px 12px; border-bottom:1px solid var(--border); background:var(--elev);
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  }
  .phead .glyph{color:var(--accent)}
  .phead .role{margin-left:auto; font-weight:500; letter-spacing:.03em; text-transform:none; color:var(--faint); font-size:10px}
  /* Library's Agents/Grouped toggle — the phead role word itself is the control (revised
     2026-07-29; replaced the earlier separate two-button segmented control). */
  .phead .role.lib-toggle{cursor:pointer; color:var(--accent-ink); font-weight:700}
  .phead .role.lib-toggle:hover{text-decoration:underline}
  .foldbtn{margin-left:8px; width:20px;height:20px;flex:0 0 auto;border:1px solid var(--border);
           background:var(--bg);color:var(--muted);border-radius:5px;cursor:pointer;font-size:11px;line-height:1;
           display:grid;place-items:center}
  .foldbtn:hover{color:var(--accent-ink);border-color:var(--accent)}
  /* when a role sits right before the fold button, don't let it push margin-left:auto twice */
  .phead .role + .foldbtn{margin-left:8px}

  /* collapsed rail */
  .rail{flex:0 0 34px; background:var(--panel); border:1px solid var(--border); border-radius:9px;
        display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0; cursor:pointer;
        color:var(--muted)}
  .rail[hidden]{display:none}
  /* a folded rail hides its side's resize gutter (nothing left to drag), which otherwise
     also carried the visual gap to the center panel — replace it with a fixed margin so
     the rail doesn't sit flush against center. */
  #railLeft{margin-right:9px}
  #railRight{margin-left:9px}
  .rail:hover{color:var(--accent-ink); border-color:var(--accent)}
  .rail .rlabel{writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; font-weight:600;
                letter-spacing:.08em; text-transform:uppercase}
  .rail .rico{font-size:12px}
  .pbody{flex:1 1 auto; min-height:0; overflow:auto}
  .pbody::-webkit-scrollbar{width:10px;height:10px}
  .pbody::-webkit-scrollbar-thumb{background:var(--grip);border-radius:6px;border:3px solid var(--panel)}

  /* ---- gutters (resizers) ---- */
  .gv{flex:0 0 9px; cursor:col-resize; position:relative}
  .gh{flex:0 0 9px; cursor:row-resize; position:relative}
  .gv::after,.gh::after{content:"";position:absolute;background:var(--border);border-radius:3px;transition:background .12s}
  .gv::after{top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:34px}
  .gh::after{top:50%;left:50%;transform:translate(-50%,-50%);height:3px;width:34px}
  .gv:hover::after,.gh:hover::after,.dragging.gv::after,.dragging.gh::after{background:var(--accent)}
  body.resizing{cursor:col-resize; user-select:none}
  body.resizing.rows{cursor:row-resize}

  /* ================= agent list ================= */
  /* Flat/Grouped view toggle — prototyped 2026-07-29, replaces the old always-on
     Personal/Pipeline + redundant "All agents" + Ungrouped stack of sections. Toggle
     control itself lives in the phead (.lib-toggle, above), not here. */
  /* zone-label reused for the "Manage" separator above the list actions — tighter margins
     to match the list's own indent (.lgroup/.laction padding) instead of the viz's 18px */
  .pbody > .zone-label{margin:14px 10px 6px}
  .lgroup{padding:6px 8px 2px; color:var(--faint); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
  .arow{
    display:flex; align-items:center; gap:8px; padding:6px 10px; margin:1px 6px;
    border-radius:7px; cursor:pointer; color:var(--muted);
  }
  .arow:hover{background:var(--bg)}
  .arow.sel{background:var(--accent-wash); color:var(--text)}
  .arow.sel .av{background:var(--accent); color:#fff}
  .av{width:20px;height:20px;border-radius:5px;background:var(--elev);border:1px solid var(--border);
      display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);flex:0 0 auto}
  .arow .nm{font-weight:500;color:var(--text)}
  .arow.muted .nm{color:var(--muted);font-weight:400}
  .arow .tag{margin-left:auto;font-size:9px;color:var(--faint)}
  .lsep{height:1px;background:var(--border);margin:8px 10px}
  .laction{display:flex;align-items:center;gap:7px;padding:7px 12px;color:var(--muted);cursor:pointer;font-size:12px}
  .laction:hover{color:var(--text)}

  /* ================= custom visualization ================= */
  .viz{padding:14px 16px 20px}
  .agentcard-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
  .bigav{width:40px;height:40px;border-radius:9px;background:var(--accent);color:#fff;
         display:grid;place-items:center;font-weight:700;font-size:17px;flex:0 0 auto}
  .agentcard-head h1{margin:0;font-size:19px;letter-spacing:-.02em;cursor:text;border-radius:6px;padding:1px 6px;margin-left:-6px}
  .agentcard-head h1:hover{background:var(--bg)}
  .agentcard-head .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .agentcard-head .model-dd{margin-left:auto;flex:0 0 auto;position:relative}

  /* ---- model + effort header control ---- */
  .me-trigger{display:flex;align-items:center;gap:8px;font:inherit;font-size:11px;font-family:var(--mono);
    border:1px solid var(--border);border-radius:7px;padding:5px 10px;background:var(--elev);color:var(--text);
    cursor:pointer;appearance:none}
  .me-trigger.warn{border-color:var(--warn);color:var(--warn)}
  .me-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .me-trigger .me-effort-tag{font-family:var(--ui);color:var(--faint);font-size:10px}
  .me-trigger .me-chev{color:var(--faint);font-size:9px;margin-left:2px}
  .me-panel{position:absolute;z-index:30;top:100%;right:0;margin-top:6px;width:260px;background:var(--elev);
    border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:left}
  .me-panel > .me-search{border-radius:10px 10px 0 0}
  .me-panel > .me-effort-row{border-radius:0 0 10px 10px}
  .me-search{width:100%;box-sizing:border-box;font:inherit;font-size:12px;padding:9px 12px;border:none;
    border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none}
  .me-list{max-height:220px;overflow-y:auto;padding:4px 0}
  .me-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;font-size:12px;
    font-family:var(--mono);cursor:pointer;color:var(--text)}
  .me-opt:hover{background:var(--accent-wash)}
  .me-opt .ck{color:var(--accent);font-weight:700;font-family:var(--ui);flex:none}
  .me-empty{padding:10px 12px;font-size:11.5px;color:var(--faint);font-style:italic}
  .me-effort-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
    border-top:1px solid var(--border);font-size:11px;cursor:pointer;color:var(--text);background:var(--bg)}
  .me-effort-row .lbl{font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
  .me-effort-row .val{display:flex;align-items:center;gap:5px;color:var(--muted);font-family:var(--ui)}
  .me-effort-panel{position:absolute;z-index:31;right:100%;bottom:0;margin-right:6px;width:230px;
    background:var(--elev);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .me-effort-desc{padding:10px 12px 4px;font-size:11px;color:var(--faint);line-height:1.4}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);font-size:10.5px;
        padding:3px 9px;border-radius:999px;background:var(--elev);border:1px solid var(--border);color:var(--text)}
  .pill .pk{color:var(--faint);font-size:10px}
  .pill .pv{color:var(--text);font-weight:500;font-family:var(--mono);font-size:10.5px}
  .pill.grp{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash);font-family:var(--ui);font-size:11px}
  .pill.warn{border-color:var(--warn);color:var(--warn);background:var(--elev)}
  .pill.warn::before{content:"⚠";font-size:10px}
  /* red/invalid tier — prototyped 2026-07-29, distinct from yellow/warn (well-formed but
     unrecognized). Red = structurally malformed (e.g. maxTurns holding a non-number).
     Icon not yet confirmed with the user — ✕ chosen here, ❗ was the other candidate. */
  .pill.bad{border-color:var(--err);color:var(--err);background:var(--elev)}
  .pill.bad::before{content:"✕";font-size:10px}
  .pill.more{cursor:pointer;font-family:var(--ui);font-weight:600;color:var(--accent-ink);
    border-color:var(--accent);background:var(--accent-wash)}
  .key-label{font-size:10px;color:var(--faint);margin-right:2px}

  /* ================= Tier 1 config — editable two-tier zone ================= */
  .pill[onclick]{cursor:pointer}
  .pill.unset{color:var(--faint);border-style:dashed;font-style:italic;cursor:default}
  .pill.dashed{border-style:dashed}
  .pill.add{font-family:var(--ui);font-weight:600;color:var(--accent-ink);border-color:var(--accent);background:var(--accent-wash)}
  .pill .x{margin-left:2px;opacity:.55;font-weight:700}
  .pill .x:hover{opacity:1}
  .pill.selected{border-color:var(--text)}
  .swatch{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15);display:inline-block;margin-right:4px}

  .scalar-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;margin-bottom:10px}
  .list-rows{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .list-row{display:flex;align-items:flex-start;gap:8px;border-radius:8px;margin:0 -6px;padding:4px 6px;transition:background .12s}
  .list-row:hover{background:var(--warn-wash,rgba(179,128,28,.09))}
  .row-label{flex:none;width:104px;text-align:right;font-size:10px;color:var(--faint);padding-top:4px;
             display:flex;align-items:center;justify-content:flex-end;gap:5px}
  .row-pills{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .row-remove{opacity:0;transition:opacity .12s;flex:none;width:16px;height:16px;border-radius:4px;
    border:1px solid var(--border);background:var(--elev);color:var(--faint);font-size:11px;line-height:1;
    display:grid;place-items:center;cursor:pointer;margin-top:2px;padding:0}
  .list-row:hover .row-remove{opacity:1}
  .row-remove:hover{color:var(--err);border-color:var(--err)}
  .badge.required{color:var(--muted);background:var(--bg);border:1px solid var(--border);flex:none;margin-top:2px}

  .inline-input{font:inherit;font-size:10.5px;font-family:var(--mono);border:1px solid var(--accent);
    border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--text);outline:none;width:130px}
  .inline-input.wide{width:220px}

  /* scalar bool/enum popover — same look as the model+effort control's .me-list/.me-opt,
     just anchored to a small inline pill instead of the header, no search box */
  .pill-pick{position:relative;display:inline-block}
  .opt-panel{position:absolute;z-index:30;top:100%;left:0;margin-top:6px;min-width:150px;background:var(--elev);
    border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.03em;
         text-transform:uppercase;padding:2px 7px;border-radius:5px;flex:none}
  .badge.main-only{color:var(--muted);background:var(--bg);border:1px solid var(--border)}

  .initial-prompt-block,.custom-json-block{margin-top:14px;border:1px solid var(--border);border-radius:9px;
    background:var(--elev);padding:9px 12px;cursor:pointer}
  .initial-prompt-block .ipk,.custom-json-block .ipk{font-size:10px;color:var(--faint);text-transform:uppercase;
    letter-spacing:.06em;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:7px}
  .initial-prompt-block .ipk .expandhint,.custom-json-block .ipk .expandhint{margin-left:auto;color:var(--accent-ink);
    font-weight:600;text-transform:none;letter-spacing:0}
  .initial-prompt-block p,.custom-json-block p{margin:0;color:var(--muted);font-size:12px;font-family:var(--mono)}
  .initial-prompt-block textarea,.custom-json-block textarea{width:100%;min-height:90px;font-family:var(--mono);
    font-size:11.5px;border:1px solid var(--accent);border-radius:7px;padding:8px;background:var(--bg);
    color:var(--text);outline:none;resize:vertical}
  .custom-json-block textarea{min-height:130px}
  .ip-actions{margin-top:7px;display:flex;gap:8px;align-items:center}
  .ip-actions button{font:inherit;font-size:11px;border-radius:6px;padding:5px 11px;cursor:pointer;border:none}
  .ip-actions .save{background:var(--accent);color:#fff;font-weight:600}
  .ip-actions .cancel{background:transparent;color:var(--muted)}
  .ip-actions .jerr{color:var(--err);font-size:11px}

  .add-key-btn{width:16px;height:16px;border-radius:5px;border:1px solid var(--border);background:var(--elev);
    color:var(--faint);font-size:12px;font-weight:700;line-height:1;cursor:pointer;display:grid;place-items:center;
    padding:0;font-family:var(--ui);text-transform:none;letter-spacing:0}
  .add-key-btn:hover{color:var(--text);border-color:var(--text)}

  .add-anchor{position:relative;display:inline-block}
  .tool-picker{position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:var(--elev);
    border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);width:230px}
  .tool-picker input{width:100%;box-sizing:border-box;font:inherit;font-size:11.5px;padding:7px 9px;
    border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none}
  .tool-picker .hint{padding:6px 9px 0;font-size:10px;color:var(--faint)}
  .tool-picker .opts{max-height:170px;overflow-y:auto}
  .tool-picker .opt{padding:6px 9px;font-size:11.5px;font-family:var(--mono);cursor:pointer;color:var(--text)}
  .tool-picker .opt:hover{background:var(--accent-wash)}
  .tool-picker .empty{padding:8px 9px;font-size:11px;color:var(--faint);font-style:italic}

  .zone-label{display:flex;align-items:center;gap:8px;margin:18px 0 9px;color:var(--faint);
              font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .zone-label::after{content:"";flex:1;height:1px;background:var(--border)}
  .zone-label .tier{color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;
                    font-size:9px;letter-spacing:.03em}

  .sec{border:1px solid var(--border);border-radius:9px;margin-bottom:9px;background:var(--elev);overflow:hidden}
  .sec-h{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer}
  .sec-h .chev{color:var(--faint);font-size:10px}
  .sec-h .h{font-weight:600;font-size:12px;letter-spacing:.02em}
  .sec-h .core{margin-left:auto;font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .sec-h .edited{margin-left:auto;font-size:9.5px;color:var(--accent-ink);background:var(--accent-wash);
                 border:1px solid var(--accent);border-radius:5px;padding:1px 7px;letter-spacing:.02em}
  .sec-b{padding:0 12px 12px 30px;color:var(--muted);font-size:12px}
  .sec-b[onclick]{cursor:pointer}
  .sec-b textarea{width:100%;min-height:110px;font-family:var(--ui);font-size:12px;border:1px solid var(--accent);
    border-radius:7px;padding:8px;background:var(--bg);color:var(--text);outline:none;resize:vertical;box-sizing:border-box}
  .sec-b p{margin:0 0 6px}
  .sec-b ol{margin:2px 0;padding-left:18px}
  .sec-b li{margin:2px 0}
  .sec-b .hl{color:var(--text)}

  /* ================= raw md ================= */
  .raw{font-family:var(--mono);font-size:12px;line-height:1.65;padding:10px 0}
  .rline{display:flex}
  .rn{flex:0 0 40px;text-align:right;padding-right:14px;color:var(--faint);

  window.__cfgSaveScalar = function (key, value) { CFG_AGENT[key] = value; cfgState.editing = null; cfgRerender(); };
  window.__cfgSaveInt = function (key, raw) {
    const n = parseInt(raw, 10);
    if (Number.isFinite(n) && n > 0) CFG_AGENT[key] = n;
    cfgState.editing = null; cfgRerender();
  };
  document.addEventListener('click', (e) => {
    if (!cfgState.editing) return;
    const def = CFG_CATALOG[cfgState.editing];
    if (!def || (def.datatype !== 'bool' && def.datatype !== 'enum')) return; // int (maxTurns) closes via its own input blur
    if (!e.target.closest(`.pill-pick[data-key="${cfgState.editing}"]`)) window.__cfgCancelEdit();
  });

  // ---- list rows (tools / disallowedTools / skills) ----
  function cfgAgentPill(item) {
    const restriction = item.startsWith('Agent(') ? item.slice(6, -1) : '';
    if (cfgState.editingRestriction) {
      return `<span class="add-anchor"><input class="inline-input wide" value="${cfgEsc(restriction)}" placeholder="worker, researcher (blank = unrestricted)" autofocus ` +
        `onkeydown="if(event.key==='Enter')window.__cfgSaveRestriction(this.value); if(event.key==='Escape')window.__cfgCancelRestriction();" ` +
        `onblur="window.__cfgSaveRestriction(this.value)"></span>`;
    }
    return `<span class="pill" title="Agent tool · restricts which subagent types this agent may spawn — only when THIS agent runs as the MAIN session agent, no effect when invoked as a subagent" onclick="window.__cfgEditRestriction(event)">` +
      `${cfgEsc(item)}<span class="badge main-only" title="Only takes effect via claude --agent, not @-mention/Agent-tool invocation">⌘ main-agent only</span>` +
      `<span class="x" onclick="event.stopPropagation();window.__cfgRemoveItem('tools', ${JSON.stringify(item)})">×</span></span>`;
  }
  window.__cfgEditRestriction = function (e) { e.stopPropagation(); cfgState.editingRestriction = true; cfgRerender(); };
  window.__cfgCancelRestriction = function () { cfgState.editingRestriction = false; cfgRerender(); };
  window.__cfgSaveRestriction = function (raw) {
    const trimmed = raw.trim();
    const idx = CFG_AGENT.tools.findIndex(t => t === 'Agent' || t.startsWith('Agent('));
    if (idx >= 0) CFG_AGENT.tools[idx] = trimmed ? `Agent(${trimmed})` : 'Agent';
    cfgState.editingRestriction = false; cfgRerender();
  };
  // Clicking a list-item pill's body only *selects* it (a harmless highlight) — it does
  // NOT remove it. Only the × removes. Clicking outside a selected pill deselects it, like
  // a cancel — previously the whole pill (body included) triggered removal on any click,
  // which was one accidental click away from silently deleting an entry.
  // MCP tools (mcp__server or mcp__server__tool) render their full qualified name by
  // default, which is exactly the "too much info per pill" the user flagged 2026-07-29 —
  // a real `dev`-style agent with ~40 atlassian-mcp-server__* tools turns into an unreadable
  // wall of text even under the cap. Compact display: just the tool (or server, for a
  // whole-server grant) with an "mcp:" prefix; the full qualified name lives in the tooltip
  // and is still what's stored/removed/matched underneath — display-only shortening.
  const CFG_MCP_DISPLAY_RE = /^mcp__([\w.-]+?)(?:__([\w.-]+))?$/;
  function cfgMcpDisplay(item) {
    const m = item.match(CFG_MCP_DISPLAY_RE);
    if (!m) return null;
    const [, server, tool] = m;
    return { server, tool };
  }
  function cfgItemPill(key, item) {
    if (key === 'tools' && (item === 'Agent' || item.startsWith('Agent('))) return cfgAgentPill(item);
    const bad = cfgIsBadListItem(key, item);
    const dashed = key === 'disallowedTools' ? ' dashed' : '';
    const selected = cfgState.selectedItem && cfgState.selectedItem.key === key && cfgState.selectedItem.item === item;
    const cls = (bad ? 'warn' : '') + (selected ? ' selected' : '');
    const mcp = cfgMcpDisplay(item);
    const displayText = mcp ? cfgEsc('mcp:' + (mcp.tool || mcp.server)) : cfgEsc(item);
    const title = bad ? `'${cfgEsc(item)}' is not a recognized ${key} value.`
      : mcp ? `${cfgEsc(item)} · MCP tool on server "${cfgEsc(mcp.server)}"${mcp.tool ? '' : ' · whole server'}`
      : `${key} · list`;
    return `<span class="pill ${cls}${dashed}" title="${title}" onclick="event.stopPropagation();window.__cfgSelectItem('${key}', ${JSON.stringify(item)})">${displayText}` +
      `<span class="x" onclick="event.stopPropagation();window.__cfgRemoveItem('${key}', ${JSON.stringify(item)})">×</span></span>`;
  }
  window.__cfgSelectItem = function (key, item) { cfgState.selectedItem = { key, item }; cfgRerender(); };
  document.addEventListener('click', () => {
    if (cfgState.selectedItem) { cfgState.selectedItem = null; cfgRerender(); }
  });
  window.__cfgRemoveItem = function (key, item) { CFG_AGENT[key] = CFG_AGENT[key].filter(i => i !== item); cfgState.selectedItem = null; cfgRerender(); };
  function cfgListRowPills(key) {
    const items = CFG_AGENT[key] || [];
    const capped = items.length > CFG_LIST_CAP && !cfgState.listExpanded[key];
    const visible = capped ? items.slice(0, CFG_LIST_CAP) : items;
    let inner = visible.map(it => cfgItemPill(key, it)).join('');
    if (items.length > CFG_LIST_CAP) {
      inner += capped
        ? `<span class="pill more" onclick="event.stopPropagation();window.__cfgToggleListExpand('${key}')">+${items.length - CFG_LIST_CAP} more ▾</span>`
        : `<span class="pill more" onclick="event.stopPropagation();window.__cfgToggleListExpand('${key}')">show less ▴</span>`;
    }
    if (capped) return inner; // hide the add control while collapsed, same as it hides the tail items
    if (key === 'tools') {
      const remaining = [...CFG_BUILTIN_TOOLS].filter(t => !items.includes(t));
      inner += `<span class="add-anchor"><span class="pill add" onclick="window.__cfgOpenToolPicker(event)">+ add</span>` +
        (cfgState.toolPickerOpen ? cfgToolPicker(remaining) : '') + `</span>`;
    } else if (cfgState.addingItem === key) {
      inner += `<input class="inline-input" id="cfgAddInput" placeholder="type, Enter to add" onkeydown="window.__cfgAddInputKey(event,'${key}')" onblur="window.__cfgCancelAdd()">`;
    } else {
      inner += `<span class="pill add" onclick="window.__cfgStartAdd('${key}')">+ add</span>`;
    }
    return inner;
  }
  window.__cfgToggleListExpand = function (key) { cfgState.listExpanded[key] = !cfgState.listExpanded[key]; cfgRerender(); };
  window.__cfgStartAdd = function (key) { cfgState.addingItem = key; cfgRerender(); setTimeout(() => document.getElementById('cfgAddInput')?.focus(), 0); };
  window.__cfgCancelAdd = function () { cfgState.addingItem = null; cfgRerender(); };
  window.__cfgAddInputKey = function (e, key) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const v = e.target.value.trim().replace(/,$/, '');
      if (v) CFG_AGENT[key] = [...(CFG_AGENT[key] || []), v];
      cfgState.addingItem = null; cfgRerender();
    } else if (e.key === 'Escape') { cfgState.addingItem = null; cfgRerender(); }
  };
  window.__cfgOpenToolPicker = function (e) { e.stopPropagation(); cfgState.toolPickerOpen = true; cfgState.toolPickerFilter = ''; cfgRerender(); setTimeout(() => document.getElementById('cfgToolPickerInput')?.focus(), 0); };
  window.__cfgPickTool = function (t) { const v = (t || '').trim(); if (v) CFG_AGENT.tools = [...(CFG_AGENT.tools || []), v]; cfgState.toolPickerOpen = false; cfgRerender(); };
  window.__cfgFilterToolPicker = function (v) { cfgState.toolPickerFilter = v; cfgRerender(); };
  function cfgToolPicker(remaining) {
    const q = cfgState.toolPickerFilter.toLowerCase();
    const filtered = remaining.filter(t => t.toLowerCase().includes(q));
    return `<div class="tool-picker" onclick="event.stopPropagation()">` +
      `<input id="cfgToolPickerInput" placeholder="Filter, or type mcp__… / Agent(…)" value="${cfgEsc(cfgState.toolPickerFilter)}" ` +
      `oninput="window.__cfgFilterToolPicker(this.value)" onkeydown="if(event.key==='Enter')window.__cfgPickTool(this.value);">` +
      `<div class="hint">Built-ins below, or type a custom mcp__server / mcp__server__tool / Agent(types) value and press Enter</div>` +
      `<div class="opts">${filtered.length ? filtered.map(t => `<div class="opt" onclick="window.__cfgPickTool('${t}')">${t}</div>`).join('') : '<div class="empty">No built-in matches — Enter adds it as typed</div>'}</div>` +
      `</div>`;
  }
  document.addEventListener('click', (e) => {
    if (cfgState.toolPickerOpen && !e.target.closest('.add-anchor')) { cfgState.toolPickerOpen = false; cfgRerender(); }
  });

  // ---- initialPrompt block ----
  function cfgInitialPrompt() {
    const def = CFG_CATALOG.initialPrompt;
    const set = Object.prototype.hasOwnProperty.call(CFG_AGENT, 'initialPrompt');
    if (!set && !cfgState.expandedPrompt) return '';
    const value = CFG_AGENT.initialPrompt || '';
    const badge = `<span class="badge main-only" title="Only used when this agent runs as the MAIN session agent (claude --agent &lt;name&gt;) — ignored when invoked as a subagent via @-mention or the Agent tool, which is the common case here">⌘ main-agent only</span>`;
    const labelHtml = `<span title="${cfgEsc(def.hint || '')}">${def.label}</span>`;
    if (!cfgState.expandedPrompt) {
      const truncated = value.length > 110 ? value.slice(0, 110) + '…' : value;
      return `<div class="initial-prompt-block" onclick="window.__cfgExpandPrompt(event)">` +
        `<div class="ipk">${labelHtml} ${badge}<span class="expandhint">⌯ expand</span></div>` +
        `<p>${cfgEsc(truncated) || '<i>(empty)</i>'}</p></div>`;
    }
    return `<div class="initial-prompt-block" style="cursor:default" onclick="event.stopPropagation()">` +
      `<div class="ipk">${labelHtml} ${badge}</div>` +
      `<textarea id="cfgIpTextarea">${cfgEsc(value)}</textarea>` +
      `<div class="ip-actions"><button class="save" onclick="window.__cfgSavePrompt()">Save</button><button class="cancel" onclick="window.__cfgCancelPrompt()">Cancel</button></div></div>`;
  }
  window.__cfgExpandPrompt = function (e) { e && e.stopPropagation(); cfgResolveAnyOpenEditor(); cfgState.expandedPrompt = true; cfgRerender(); document.getElementById('cfgIpTextarea')?.focus(); };
  window.__cfgSavePrompt = function () { CFG_AGENT.initialPrompt = document.getElementById('cfgIpTextarea').value; cfgState.expandedPrompt = false; cfgRerender(); };
  window.__cfgCancelPrompt = function () { cfgState.expandedPrompt = false; cfgRerender(); };
  // Click outside an expanded initialPrompt block: silently exit if unchanged, otherwise
  // confirm save/discard, then always exit edit mode either way.
  window.__cfgOutsideClosePrompt = function () {
    const ta = document.getElementById('cfgIpTextarea');
    if (!ta) { cfgState.expandedPrompt = false; cfgRerender(); return; }
    const original = CFG_AGENT.initialPrompt || '';
    if (ta.value !== original) {
      if (confirm('Save changes to Initial prompt?')) CFG_AGENT.initialPrompt = ta.value;
    }
    cfgState.expandedPrompt = false;
    cfgRerender();
  };
  document.addEventListener('click', (e) => {
    if (cfgState.expandedPrompt && !e.target.closest('.initial-prompt-block')) window.__cfgOutsideClosePrompt();
  });

  // ---- custom-JSON blocks (hooks, mcpServers) ----
  function cfgCustomBlock(key) {
    const def = CFG_CATALOG[key];
    const set = Object.prototype.hasOwnProperty.call(CFG_AGENT, key);
    if (!set && cfgState.expandedCustom !== key) return '';
    const value = CFG_AGENT[key];
    const summary = key === 'hooks'
      ? Object.keys(value || {}).length + ' event' + (Object.keys(value || {}).length === 1 ? '' : 's') + ' configured'
      : (Array.isArray(value) ? value.length : Object.keys(value || {}).length) + ' entries';
    const labelHtml = `<span title="${cfgEsc(def.hint || '')}">${def.label}</span>`;
    if (cfgState.expandedCustom !== key) {
      return `<div class="custom-json-block" data-key="${key}" onclick="window.__cfgExpandCustom(event,'${key}')">` +
        `<div class="ipk">${labelHtml} <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)">· custom · saved as-is</span><span class="expandhint">⌯ view / edit JSON</span></div>` +
        `<p>${cfgEsc(summary)}</p></div>`;
    }
    return `<div class="custom-json-block" data-key="${key}" style="cursor:default" onclick="event.stopPropagation()">` +
      `<div class="ipk">${labelHtml} <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)">· custom · saved as-is</span></div>` +
      `<textarea id="cfgCustomTextarea">${cfgEsc(JSON.stringify(value, null, 2))}</textarea>` +
      `<div class="ip-actions"><button class="save" onclick="window.__cfgSaveCustom('${key}')">Save</button>` +
      `<button class="cancel" onclick="window.__cfgCancelCustom()">Cancel</button><span class="jerr" id="cfgCustomErr"></span></div></div>`;
  }
  window.__cfgExpandCustom = function (e, key) { e && e.stopPropagation(); cfgResolveAnyOpenEditor(); cfgState.expandedCustom = key; cfgRerender(); setTimeout(() => document.getElementById('cfgCustomTextarea')?.focus(), 0); };
  window.__cfgCancelCustom = function () { cfgState.expandedCustom = null; cfgRerender(); };
  window.__cfgSaveCustom = function (key) {
    try {
      CFG_AGENT[key] = JSON.parse(document.getElementById('cfgCustomTextarea').value);
      cfgState.expandedCustom = null; cfgRerender();
    } catch (err) { document.getElementById('cfgCustomErr').textContent = 'Invalid JSON: ' + err.message; }
  };
  // Click outside an expanded custom-JSON block: silently exit if unchanged. If changed,
  // confirm save/discard — but if the confirmed save is invalid JSON, stay open with the
  // error shown rather than silently discarding a typo the user asked to keep.
  window.__cfgOutsideCloseCustom = function () {
    const key = cfgState.expandedCustom;
    const ta = document.getElementById('cfgCustomTextarea');
    if (!ta) { cfgState.expandedCustom = null; cfgRerender(); return; }
    const original = JSON.stringify(CFG_AGENT[key], null, 2);
    if (ta.value === original) { cfgState.expandedCustom = null; cfgRerender(); return; }
    if (confirm(`Save changes to ${CFG_CATALOG[key].label}?`)) {
      try {
        CFG_AGENT[key] = JSON.parse(ta.value);
      } catch (err) {
        document.getElementById('cfgCustomErr').textContent = 'Invalid JSON: ' + err.message;
        return; // stay open, don't lose their edit
      }
    }
    cfgState.expandedCustom = null;
    cfgRerender();
  };
  document.addEventListener('click', (e) => {
    if (cfgState.expandedCustom && !e.target.closest(`.custom-json-block[data-key="${cfgState.expandedCustom}"]`)) window.__cfgOutsideCloseCustom();
  });

  // ---- "+" add-key button, on the Keys header line (covers fixed AND custom keys) ----
  // Always ends with "+ custom key…" regardless of how many catalog keys remain — the
  // catalog (permissionMode..mcpServers) can run out, but a genuinely nonstandard key
  // (unknown to CONFIG_DEFS, saved as raw JSON) should still be addable.
  function cfgAddKeyButton() {
    const unset = Object.keys(CFG_CATALOG).filter(k => !Object.prototype.hasOwnProperty.call(CFG_AGENT, k));
    const menu = !cfgState.addKeyMenuOpen ? '' : `<div class="opt-panel" onclick="event.stopPropagation()"><div class="me-list">` +
      (unset.length ? unset.map(k => `<div class="me-opt" onclick="window.__cfgAddKey('${k}')">${CFG_CATALOG[k].label}${CFG_CATALOG[k].tier === 'custom' ? '<span style="color:var(--faint);font-size:10px;margin-left:6px">custom</span>' : ''}</div>`).join('') : '<div class="me-empty">All catalog keys are set</div>') +
      `<div class="me-opt" style="border-top:1px solid var(--border)" onclick="window.__cfgAddCustomKey()">+ custom key…<span style="color:var(--faint);font-size:10px;margin-left:6px">arbitrary, raw JSON</span></div>` +
      `</div></div>`;
    return `<span class="pill-pick add-key-anchor"><button type="button" class="add-key-btn" title="Add a config key" onclick="event.stopPropagation();window.__cfgToggleAddKeyMenu()">+</button>${menu}</span>`;
  }
  window.__cfgToggleAddKeyMenu = function () { cfgState.addKeyMenuOpen = !cfgState.addKeyMenuOpen; cfgRerender(); };
  document.addEventListener('click', (e) => {
    if (cfgState.addKeyMenuOpen && !e.target.closest('.add-key-anchor')) { cfgState.addKeyMenuOpen = false; cfgRerender(); }
  });
  window.__cfgAddKey = function (key) {
    const def = CFG_CATALOG[key];
    if (def.datatype === 'list') CFG_AGENT[key] = [];
    else if (def.datatype === 'bool') CFG_AGENT[key] = false;
    else if (def.datatype === 'int') CFG_AGENT[key] = 10;
    else if (def.datatype === 'enum') CFG_AGENT[key] = def.allowed[0];
    else if (def.datatype === 'string') CFG_AGENT[key] = '';
    else CFG_AGENT[key] = {};
    cfgState.addKeyMenuOpen = false;
    if (def.tier === 'custom') cfgState.expandedCustom = key;
    else if (key === 'initialPrompt') cfgState.expandedPrompt = true;
    else if (def.datatype === 'list') cfgState.addingItem = key;
    cfgRerender();
  };
  // A genuinely nonstandard key — not in CONFIG_DEFS at all. Synthesizes a minimal
  // catalog entry (datatype 'any', tier 'custom') so it renders through the exact same
  // raw-JSON block machinery as hooks/mcpServers, then opens straight into that editor.
  window.__cfgAddCustomKey = function () {
    const raw = prompt('Custom key name (a nonstandard config field, saved as raw JSON):');
    const name = raw && raw.trim();
    if (!name) return;
    if (CFG_CATALOG[name] && Object.prototype.hasOwnProperty.call(CFG_AGENT, name)) {
      alert(`'${name}' already exists on this agent.`);
      return;
    }
    if (!CFG_CATALOG[name]) {
      CFG_CATALOG[name] = { label: name, datatype: 'any', tier: 'custom', required: false, allowed: null };
      CFG_CUSTOM_KEYS.push(name);
    }
    CFG_AGENT[name] = {};
    cfgState.addKeyMenuOpen = false;
    cfgState.expandedCustom = name;
    cfgRerender();
  };

  window.__cfgToggleKeysCollapse = function () { cfgState.keysCollapsed = !cfgState.keysCollapsed; cfgRerender(); };
  function buildConfig(host) {
    const area = host && host.querySelector('#configArea'); if (!area) return;
    const chev = cfgState.keysCollapsed ? '▸' : '▾';
    const keysLabel = `<div class="zone-label" style="cursor:pointer" onclick="window.__cfgToggleKeysCollapse()" title="${cfgState.keysCollapsed ? 'Expand' : 'Collapse'} config keys">` +
      `<span class="tier">Config</span> Keys <span class="chev" style="color:var(--faint);font-size:9px">${chev}</span>${cfgAddKeyButton()}</div>`;
    let keysHtml = '';
    if (!cfgState.keysCollapsed) {
      const scalarHtml = CFG_SCALAR_KEYS.filter(k => Object.prototype.hasOwnProperty.call(CFG_AGENT, k)).map(cfgScalarRow).join('');
      const listHtml = CFG_LIST_KEYS.filter(k => Object.prototype.hasOwnProperty.call(CFG_AGENT, k) || CFG_IMPORTANT_UNSET.includes(k)).map(k => {
        const isUnset = !Object.prototype.hasOwnProperty.call(CFG_AGENT, k);
        const hint = cfgEsc(CFG_CATALOG[k].hint || '');
        if (isUnset) {
          if (!CFG_IMPORTANT_UNSET.includes(k)) return '';
          return `<div class="list-row"><span class="row-label" title="${hint}">${CFG_CATALOG[k].label}</span><div class="row-pills"><span class="pill unset">not set</span></div>${cfgRowTrailing(k, false)}</div>`;
        }
        return `<div class="list-row"><span class="row-label" title="${hint}">${k === 'disallowedTools' ? '⊘ ' : ''}${CFG_CATALOG[k].label}</span><div class="row-pills">${cfgListRowPills(k)}</div>${cfgRowTrailing(k, true)}</div>`;
      }).join('');
      keysHtml = `<div class="scalar-grid">${scalarHtml}</div><div class="list-rows">${listHtml}</div>`;
    }
    const customHtml = CFG_CUSTOM_KEYS.map(cfgCustomBlock).join('');
    area.innerHTML = `${keysLabel}${keysHtml}${cfgInitialPrompt()}${customHtml}`;
  }

  // ---------- Tier 2 sections (editable) ----------
  // Same interaction pattern as the Tier 1 blocks above (click to expand into a textarea,
  // click outside silently exits if unchanged or confirms save/discard if changed) — built
  // specifically to prove that pattern generalizes past config, not just to match visually.
  // Body rendering here is a simplified mockup stand-in (numbered lines -> <ol>, blank-line
  // paragraphs otherwise), not real markdown — the real app renders actual section markdown.
  // Real agent, ImportTestAgent/TestAgent.md (loaded 2026-08-06, replaces the earlier
  // secure-code-auditor demo — see the matching note on CFG_AGENT above). Real headings are
  // "## " (level 2), Title Case, not "# "/ALL CAPS like the old demo — shown verbatim. The
  // real file's headingless preamble ("You are an Anthropic-focused...") is folded into the
  // opening of Role rather than given its own section, since this mockup's section model has
  // no headingless-preamble slot (the real app's schema does — agentSection.heading is
  // nullable). Process is condensed to its 5 top-level numbered steps, dropping each step's
  // markdown sub-bullets — cfgSectionBodyHtml below (a deliberately simplified mockup
  // stand-in, not a real markdown renderer) only special-cases a block where EVERY line is
  // "N. ..."; nested sub-bullets would break that detection and fall back to raw escaped
  // paragraph text. The Raw panel (RAW array below) carries the fuller original text instead.
  const CFG_SECTIONS = [
    { key: 'role', heading: 'Role', core: true, collapsed: false,
      text: "You are an Anthropic-focused governance, safety, and compliance sentinel.\n\nYour job is to review, constrain, and document any work that touches Anthropic agents (managed or local), skills, hooks, MCP servers, and tools; Anthropic API usage, keys, routing, and environment configuration; deployment pipelines that rely on Anthropic models or the Claude Agent SDK; and security, privacy, and safety posture for these systems.\n\nYou do not implement features or write production code directly. Instead, you analyze proposed changes and existing configurations, identify risks and missing guardrails, propose concrete mitigations, and maintain a clear audit trail of decisions and rationale." },
    { key: 'operating-principles', heading: 'Operating principles', core: true, collapsed: false,
      text: "1. Safety-first: Default to the safest reasonable option when tradeoffs exist.\n2. Least privilege: Minimize tool access, credentials exposure, and write capabilities.\n3. Explicit consent: Any destructive or high-risk operation must be gated by human review.\n4. Defense in depth: Combine configuration, hooks, and process guardrails, never rely on a single layer.\n5. Traceability: Every significant decision should be explainable and discoverable later." },
    { key: 'process', heading: 'Process', core: true, collapsed: false,
      text: "1. Discovery — locate agent, skill, MCP server, hook, and permission/mode configs; classify into core runtime, integration, and governance.\n2. Risk assessment — evaluate each component for security, safety, and compliance risk; assign a severity of Critical, High, Medium, or Low.\n3. Guardrail design — recommend concrete changes: tightening tools/disallowedTools, permission modes, PreToolUse/PostToolUse hooks, isolation, and memory settings.\n4. Behavioral patterns — encode reusable agent patterns (secure coding agent, deployment gatekeeper, incident responder) with scope, tools, hooks, and permissions.\n5. Reporting and audit — produce structured findings by severity with what, why, where, and how to fix, plus quick wins and long-term governance recommendations." },
    { key: 'output-format', heading: 'Output format', core: true, collapsed: false,
      text: "Governance posture overview (summary and key stats), Findings by severity (Critical / High / Medium / Low, each with a Finding ID, title, context, details, recommendation, and an example configuration), Recommended guardrails (agent patterns, hook patterns, permission and isolation strategy, monitoring and audit), and Next steps (immediate actions, short-term improvements, long-term governance)." },
  ];
  function cfgSectionBodyHtml(text) {
    const lines = text.split('\n').filter(l => l.trim() !== '');
    const isList = lines.length > 0 && lines.every(l => /^\d+\.\s/.test(l.trim()));
    if (isList) return '<ol>' + lines.map(l => `<li>${cfgEsc(l.trim().replace(/^\d+\.\s*/, ''))}</li>`).join('') + '</ol>';
    return text.split(/\n\s*\n/).map(p => `<p>${cfgEsc(p.trim())}</p>`).join('');
  }
  function cfgSectionHtml(sec) {
    if (cfgState.editingSection === sec.key) {
      return `<div class="sec" data-key="${sec.key}">` +
        `<div class="sec-h"><span class="h">${sec.heading}</span><span class="core">${sec.core ? 'core' : 'optional'}</span></div>` +
        `<div class="sec-b" style="cursor:default" onclick="event.stopPropagation()">` +
        `<textarea id="cfgSecTextarea" autofocus>${cfgEsc(sec.text)}</textarea>` +
        `<div class="ip-actions"><button class="save" onclick="window.__cfgSaveSection('${sec.key}')">Save</button><button class="cancel" onclick="window.__cfgCancelSection()">Cancel</button></div>` +
        `</div></div>`;
    }
    const chev = sec.collapsed ? '▸' : '▾';
    const bodyHtml = sec.collapsed ? '' : `<div class="sec-b" title="Click to edit" onclick="window.__cfgEditSection(event,'${sec.key}')">${cfgSectionBodyHtml(sec.text)}</div>`;
    return `<div class="sec" data-key="${sec.key}">` +
      `<div class="sec-h" onclick="window.__cfgToggleSectionCollapse('${sec.key}')"><span class="chev">${chev}</span><span class="h">${sec.heading}</span><span class="core">${sec.core ? 'core' : 'optional'}</span></div>` +
      bodyHtml + `</div>`;
  }
  window.__cfgToggleSectionCollapse = function (key) {
    if (cfgState.editingSection && cfgState.editingSection !== key) window.__cfgOutsideCloseSection();
    const sec = CFG_SECTIONS.find(s => s.key === key);
    if (sec) sec.collapsed = !sec.collapsed;
    buildSections(document.getElementById('centerTop'));
  };
  window.__cfgEditSection = function (e, key) {
    e.stopPropagation();
    cfgResolveAnyOpenEditor();
    cfgState.editingSection = key;
    buildSections(document.getElementById('centerTop'));
    setTimeout(() => document.getElementById('cfgSecTextarea')?.focus(), 0);
  };
  window.__cfgSaveSection = function (key) {
    const sec = CFG_SECTIONS.find(s => s.key === key);
    if (sec) sec.text = document.getElementById('cfgSecTextarea').value;
    cfgState.editingSection = null;
    buildSections(document.getElementById('centerTop'));
  };
  window.__cfgCancelSection = function () { cfgState.editingSection = null; buildSections(document.getElementById('centerTop')); };
  window.__cfgOutsideCloseSection = function () {
    const key = cfgState.editingSection;
    const sec = CFG_SECTIONS.find(s => s.key === key);
    const ta = document.getElementById('cfgSecTextarea');
    if (!sec || !ta) { cfgState.editingSection = null; buildSections(document.getElementById('centerTop')); return; }
    if (ta.value !== sec.text) {
      if (confirm(`Save changes to ${sec.heading}?`)) sec.text = ta.value;
    }
    cfgState.editingSection = null;
    buildSections(document.getElementById('centerTop'));
  };
  document.addEventListener('click', (e) => {
    if (cfgState.editingSection && !e.target.closest(`.sec[data-key="${cfgState.editingSection}"]`)) window.__cfgOutsideCloseSection();
  });
  window.__cfgToggleSectionsCollapse = function () { cfgState.sectionsCollapsed = !cfgState.sectionsCollapsed; buildSections(document.getElementById('centerTop')); };
  function buildSections(host) {
    const area = host && host.querySelector('#sectionsArea'); if (!area) return;
    const chev = cfgState.sectionsCollapsed ? '▸' : '▾';
    const sectionsLabel = `<div class="zone-label" style="cursor:pointer" onclick="window.__cfgToggleSectionsCollapse()" title="${cfgState.sectionsCollapsed ? 'Expand' : 'Collapse'} sections">` +
      `<span class="tier">Sections</span> Body <span class="chev" style="color:var(--faint);font-size:9px">${chev}</span></div>`;
    const sectionsHtml = cfgState.sectionsCollapsed ? '' : CFG_SECTIONS.map(cfgSectionHtml).join('');
    area.innerHTML = sectionsLabel + sectionsHtml;
  }

  // ---------- Model + effort header control ----------
  // Mirrors the real Claude model picker's shape (search + model list + a nested Effort
  // drill-down) but the model list is THIS project's own catalog (lib/blueprint/catalog.ts
  // CONFIG_DEFS.model), full values, not shortened — not whatever list another Claude
  // surface happens to show. Every pick commits immediately (like the other enum pickers
  // in this file), so no confirm-on-outside-click is needed here, unlike the block editors.
  const CFG_MODEL_ALLOWED = ['sonnet','opus','haiku','fable','claude-opus-4-8','claude-sonnet-5','claude-haiku-4-5-20251001','claude-fable-5','inherit'];
  const CFG_EFFORT_OPTS = [
    { value: null, label: 'Default', hint: 'Model default' },
    { value: 'low', label: 'Low' },
    { value: 'medium', label: 'Medium' },
    { value: 'high', label: 'High' },
    { value: 'xhigh', label: 'Extra high' },
    { value: 'max', label: 'Max' },
  ];
  const meState = { open: false, filter: '', effortOpen: false };
  function meCurrentEffort() { return Object.prototype.hasOwnProperty.call(CFG_AGENT, 'effort') ? CFG_AGENT.effort : null; }
  function meEffortLabel() { const opt = CFG_EFFORT_OPTS.find(o => o.value === meCurrentEffort()); return opt ? opt.label : cfgEsc(meCurrentEffort()); }
  function buildModelEffort(host) {
    const area = host && host.querySelector('#modelEffortArea'); if (!area) return;
    const modelBad = !CFG_MODEL_ALLOWED.includes(CFG_AGENT.model);
    let html = `<button type="button" class="me-trigger${modelBad ? ' warn' : ''}" onclick="window.__meToggle(event)" title="${modelBad ? `'${cfgEsc(CFG_AGENT.model)}' is not a current recognized model value.` : 'Model & effort'}">` +
      `${modelBad ? '⚠ ' : ''}${cfgEsc(CFG_AGENT.model)}<span class="me-effort-tag">${meEffortLabel()}</span><span class="me-chev">▾</span></button>`;
    if (meState.open) {
      const q = meState.filter.toLowerCase();
      const filtered = CFG_MODEL_ALLOWED.filter(m => m.toLowerCase().includes(q));
      html += `<div class="me-panel" onclick="event.stopPropagation()">` +
        `<input class="me-search" placeholder="Search models" value="${cfgEsc(meState.filter)}" oninput="window.__meFilter(this.value)" autofocus>` +
        `<div class="me-list">${filtered.length ? filtered.map(m => `<div class="me-opt" onclick="window.__mePickModel('${m}')">${cfgEsc(m)}${m === CFG_AGENT.model ? '<span class="ck">✓</span>' : ''}</div>`).join('') : '<div class="me-empty">No matches</div>'}</div>` +
        `<div class="me-effort-row" onclick="window.__meToggleEffort(event)"><span class="lbl">Effort</span><span class="val">${meEffortLabel()} ›</span></div>` +
        (meState.effortOpen ? `<div class="me-effort-panel">` +
          `<div class="me-effort-desc">How thoroughly Claude responds; lower effort saves tokens.</div>` +
          `<div class="me-list">${CFG_EFFORT_OPTS.map(o => {
            const sel = o.value === meCurrentEffort();
            return `<div class="me-opt" onclick="window.__mePickEffort(${o.value ? `'${o.value}'` : 'null'})">${o.label}${o.hint ? `<span style="color:var(--faint);font-size:10.5px;margin-left:6px">${o.hint}</span>` : ''}${sel ? '<span class="ck">✓</span>' : ''}</div>`;
          }).join('')}</div></div>` : '') +
        `</div>`;
    }
    area.innerHTML = html;
  }
  window.__meToggle = function (e) { e.stopPropagation(); meState.open = !meState.open; meState.filter = ''; meState.effortOpen = false; buildModelEffort(document.getElementById('centerTop')); };
  window.__meFilter = function (v) { meState.filter = v; buildModelEffort(document.getElementById('centerTop')); };
  window.__mePickModel = function (m) { CFG_AGENT.model = m; buildModelEffort(document.getElementById('centerTop')); };
  window.__meToggleEffort = function (e) { e.stopPropagation(); meState.effortOpen = !meState.effortOpen; buildModelEffort(document.getElementById('centerTop')); };
  window.__mePickEffort = function (v) {
    if (v === null) delete CFG_AGENT.effort; else CFG_AGENT.effort = v;
    meState.effortOpen = false;
    buildModelEffort(document.getElementById('centerTop'));
  };
  document.addEventListener('click', () => {
    if (meState.open) { meState.open = false; meState.effortOpen = false; buildModelEffort(document.getElementById('centerTop')); }
  });

  // ---------- slot filling ----------
  // Example A only (R10) — viz top, chat bottom, raw right. Fixed, no switcher.
  const centerTop=document.getElementById('centerTop');
  const centerBottom=document.getElementById('centerBottom');
  const right=document.getElementById('right');
  function fill(host,tplId){ host.innerHTML=''; host.appendChild(document.getElementById(tplId).content.cloneNode(true)); if(tplId==='tpl-raw') buildRaw(host); if(tplId==='tpl-viz'){ buildConfig(host); buildSections(host); buildModelEffort(host); } }

  function layout(){
    fill(centerTop,'tpl-viz');
    fill(centerBottom,'tpl-chat');
    fill(right,'tpl-raw');
    // give the right panel a collapse button
    const rh=right.querySelector('.phead');
    if(rh){ const b=document.createElement('button'); b.className='foldbtn'; b.dataset.fold='right'; b.title='Collapse'; b.textContent='⟩'; rh.appendChild(b); }
    setFold('right', foldState.right); // preserve fold across re-render
  }

  // ---------- fold side panels ----------
  const railLeft=document.getElementById('railLeft'), railRight=document.getElementById('railRight');
  const foldState={left:false,right:false};
  function setFold(side,folded){
    foldState[side]=folded;
    const panel = side==='left'?left:right;
    const rail  = side==='left'?railLeft:railRight;
    const gut   = document.querySelector(side==='left'?'[data-resize="left"]':'[data-resize="center"]');
    panel.style.display = folded?'none':'';
    if(gut) gut.style.display = folded?'none':'';
    rail.hidden = !folded;
  }
  document.addEventListener('click',e=>{
    const fb=e.target.closest('.foldbtn'); if(fb){ setFold(fb.dataset.fold,true); return; }
    if(e.target.closest('#railLeft')) setFold('left',false);
    if(e.target.closest('#railRight')) setFold('right',false);
  });

  // ---------- theme toggle ----------
  document.getElementById('themeBtn').onclick=()=>{
    const r=document.documentElement;
    const cur=r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    r.setAttribute('data-theme', cur==='dark'?'light':'dark');
  };

  // ---------- resizers ----------
  let drag=null;
  function onDown(e){
    const g=e.target.closest('[data-resize]'); if(!g) return;
    const key=g.dataset.resize; const vertical=g.classList.contains('gh');
    let target, prop;
    if(key==='left'){ target=document.getElementById('left'); prop='w'; }
    else if(key==='center'){ target=document.getElementById('right'); prop='w'; drag={target,prop,vertical:false,start:e.clientX,size:target.getBoundingClientRect().width,invert:true}; }
    else if(key==='centerTop'){ target=document.getElementById('centerBottom'); prop='h'; drag={target,prop,vertical:true,start:e.clientY,size:target.getBoundingClientRect().height,invert:true}; }
    if(key==='left'){ drag={target,prop,vertical:false,start:e.clientX,size:target.getBoundingClientRect().width,invert:false}; }
    if(!drag) return;
    g.classList.add('dragging');
    document.body.classList.add('resizing'); if(vertical) document.body.classList.add('rows');
    drag.g=g;
    e.preventDefault();
  }
  function onMove(e){
    if(!drag) return;
    if(drag.prop==='w'){
      const d=(e.clientX-drag.start)*(drag.invert?-1:1);
      const v=Math.max(150,Math.min(640,drag.size+d));
      drag.target.style.flex='0 0 '+v+'px';
    } else {
      const d=(e.clientY-drag.start)*(drag.invert?-1:1);
      const v=Math.max(120,Math.min(520,drag.size+d));
      drag.target.style.flex='0 0 '+v+'px';
    }
  }
  function onUp(){
    if(!drag) return;
    drag.g.classList.remove('dragging');
    document.body.classList.remove('resizing','rows');
    drag=null;
  }
  document.addEventListener('mousedown',onDown);
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);

  // ---------- lock simulation (Plan 08 Phase 0 demo) ----------
  // Toggles data-locked on #centerTop. The CSS rules respond:
  //   .lock-banner { display:flex } and .locked-zone { opacity:.35 }.
  // The button lives in tpl-viz so it re-appears after fill(centerTop,'tpl-viz').
  window.__lockToggle = function () {
    const ct = document.getElementById('centerTop');
    if (!ct) return;
    const locked = ct.hasAttribute('data-locked');
    if (locked) { ct.removeAttribute('data-locked'); }
    else { ct.setAttribute('data-locked', ''); }
    const btn = document.getElementById('lockSimBtn');
    if (btn) {
      btn.textContent = locked ? '⊘ lock demo' : '↺ unlock demo';
      btn.classList.toggle('active', !locked);
    }
  };

  // ---------- Apply/Discard on the live conversation card (Plan 08 Phase 0 demo, 2026-08-06) ----------
  // Only cards marked class="live" respond — the state-gallery cards further down are static
  // reference material for all five states and must stay inert (clicking their buttons would
  // otherwise wreck the "always show state N" point of that section). This is presentational
  // only: no fetch, no proposalStore, no real apply/discard logic — Phase 1's real routes
  // already exist server-side (see plans/08-prometheus-apply.md), this just makes the mockup's
  // buttons visibly do the thing they're supposed to represent, for layout debate purposes.
  document.addEventListener('click', function (e) {
    const applyBtn = e.target.closest('.proposal-card.live .pc-apply');
    const discardBtn = e.target.closest('.proposal-card.live .pc-discard');
    if (applyBtn) {
      const card = applyBtn.closest('.proposal-card.live');
      const wrapper = document.createElement('div');
      wrapper.className = 'proposal-card';
      wrapper.innerHTML = '<div class="pc-applied-line"><span class="pc-applied-ok">✓</span> Applied</div>';
      card.replaceWith(wrapper);
    } else if (discardBtn) {
      discardBtn.closest('.proposal-card.live').remove();
    }
  });

  layout();
  buildLibrary();
</script>
